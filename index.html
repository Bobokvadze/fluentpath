  <script>
    // შენახული თემის გამოყენება პირველ დახატვამდე (თეთრი "ციმციმის" თავიდან ასაცილებლად)
    (function () {
      try {
        var keys = ['fluentpath_app_state_v1'];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k.indexOf('fluentpath_user_cache_') === 0) keys.unshift(k);
        }
        for (var j = 0; j < keys.length; j++) {
          var st = JSON.parse(localStorage.getItem(keys[j]) || 'null');
          if (st && st.settings && st.settings.theme) {
            document.documentElement.setAttribute('data-theme', st.settings.theme === 'dark' ? 'dark' : 'light');
            break;
          }
        }
      } catch (e) {}
    })();
  </script>
